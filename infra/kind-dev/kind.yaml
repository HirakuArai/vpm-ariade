# kind configuration for Hyper-Swarm development cluster
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: hyper-swarm-dev
nodes:
  - role: control-plane
    # Configure port mappings for ingress
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
    # Mount extra paths for development
    extraMounts:
      - hostPath: ./data
        containerPath: /data
    # Apply node labels
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
  # Add worker nodes for multi-node testing
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "node-type=worker"
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "node-type=worker"
# Enable feature gates for development
featureGates:
  "EphemeralContainers": true
# Networking configuration
networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6443
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"