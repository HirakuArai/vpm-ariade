# Message Broker deployment for Hyper-Swarm cell communication
apiVersion: v1
kind: Namespace
metadata:
  name: hyper-swarm
  labels:
    app.kubernetes.io/part-of: hyper-swarm
---
# NATS Streaming for inter-cell messaging
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats-streaming
  namespace: hyper-swarm
  labels:
    app: nats-streaming
    component: broker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats-streaming
  template:
    metadata:
      labels:
        app: nats-streaming
        component: broker
    spec:
      containers:
      - name: nats-streaming
        image: nats-streaming:0.25.5-alpine
        ports:
        - containerPort: 4222
          name: client
        - containerPort: 8222
          name: monitoring
        command:
        - /nats-streaming-server
        args:
        - --store=file
        - --dir=/data
        - --cluster_id=hyper-swarm
        - --http_port=8222
        - --port=4222
        - --max_msgs=0
        - --max_bytes=0
        volumeMounts:
        - name: data
          mountPath: /data
        livenessProbe:
          httpGet:
            path: /
            port: monitoring
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: monitoring
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nats-streaming
  namespace: hyper-swarm
  labels:
    app: nats-streaming
    component: broker
spec:
  selector:
    app: nats-streaming
  ports:
  - name: client
    port: 4222
    targetPort: client
  - name: monitoring
    port: 8222
    targetPort: monitoring
---
# Redis for state management and caching
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: hyper-swarm
  labels:
    app: redis
    component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        component: cache
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        command:
        - redis-server
        args:
        - --appendonly yes
        - --maxmemory 256mb
        - --maxmemory-policy allkeys-lru
        volumeMounts:
        - name: data
          mountPath: /data
        livenessProbe:
          tcpSocket:
            port: redis
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: hyper-swarm
  labels:
    app: redis
    component: cache
spec:
  selector:
    app: redis
  ports:
  - name: redis
    port: 6379
    targetPort: redis