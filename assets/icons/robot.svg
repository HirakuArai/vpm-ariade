<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Robot head -->
  <rect x="4" y="2" width="8" height="6" rx="1" stroke="#6366f1" stroke-width="1" fill="none"/>
  
  <!-- Eyes -->
  <circle cx="6" cy="4.5" r="0.5" fill="#6366f1"/>
  <circle cx="10" cy="4.5" r="0.5" fill="#6366f1"/>
  
  <!-- Antenna -->
  <line x1="8" y1="2" x2="8" y2="0.5" stroke="#6366f1" stroke-width="1"/>
  <circle cx="8" cy="0.5" r="0.5" fill="#6366f1"/>
  
  <!-- Body -->
  <rect x="5" y="8" width="6" height="6" rx="0.5" stroke="#6366f1" stroke-width="1" fill="none"/>
  
  <!-- Arms -->
  <rect x="2" y="9" width="3" height="1" rx="0.5" stroke="#6366f1" stroke-width="0.5" fill="none"/>
  <rect x="11" y="9" width="3" height="1" rx="0.5" stroke="#6366f1" stroke-width="0.5" fill="none"/>
  
  <!-- Circuit pattern -->
  <line x1="6" y1="10" x2="7" y2="10" stroke="#6366f1" stroke-width="0.5"/>
  <line x1="9" y1="10" x2="10" y2="10" stroke="#6366f1" stroke-width="0.5"/>
  <line x1="7" y1="12" x2="9" y2="12" stroke="#6366f1" stroke-width="0.5"/>
</svg>